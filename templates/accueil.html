<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOOPS - Accueil</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; background: #eaf3ff; }
        .accueil {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .accueil img {
            display: block;
            width: 100%;
            height: 100vh;
            object-fit: contain;
            object-position: center;
        }
    </style>
</head>
<body>
    <main class="accueil">
        <img
            src="{{ url_for('static', filename='images/bloups-accueil.png') }}"
            alt="Page d'accueil BLOOPS présentant les fonctionnalités de la plateforme"
        >
    </main>
</body>
</html>
